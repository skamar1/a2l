baseURL = "https://a2l.gr/"
locale = "el"
defaultContentLanguage = "el"
title = "A2Labs"

# Παράγει το /robots.txt από το layouts/robots.txt. Χωρίς αυτό το Cloudflare
# Pages σέρβιρε το HTML της αρχικής στο /robots.txt με status 200.
enableRobotsTXT = true

# Κανένα άρθρο δεν έχει tags ή categories, οπότε το Hugo παρήγαγε δύο άδειες
# σελίδες (/tags/, /categories/) που έμπαιναν στο sitemap χωρίς περιεχόμενο.
disableKinds = ["taxonomy", "term"]

# Το Hugo προσθέτει μόνο του <meta name="generator" content="Hugo x.y"> στην
# αρχική όταν το template δεν καλεί το hugo.Generator — δηλαδή ακριβώς επειδή
# το αφαιρέσαμε από το head.html. Διαφημίζει έκδοση σε επίδοξο επιτιθέμενο.
disableHugoGeneratorInject = true

# Το static/ είναι mounted ΚΑΙ ως assets, ώστε οι εικόνες του να είναι
# resources και να μπορεί το head.html να φτιάξει από αυτές πραγματικό
# OG banner (διαστάσεις, μετατροπή σε JPEG). Οι εικόνες μένουν εκεί που
# ήταν — το mount δεν τις μετακινεί, απλώς τις κάνει και επεξεργάσιμες.
# Μόλις δηλωθεί έστω ένα mount για ένα component, τα προεπιλεγμένα του
# χάνονται· γι' αυτό δηλώνονται ρητά και τα assets->assets, static->static.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"

