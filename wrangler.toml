# Ρυθμίσεις Cloudflare Pages Functions.
#
# Το Pages χτίζει με το build.sh· εδώ δηλώνονται μόνο όσα χρειάζονται οι
# functions/. Το ίδιο αρχείο χρησιμεύει και για `wrangler pages dev`.

name = "a2l"
pages_build_output_dir = "public"
compatibility_date = "2026-01-01"

# Αποτελέσματα ελέγχου (μόνιμοι σύνδεσμοι) + μετρητής ορίου ανά IP.
#
# ΠΡΟΣΟΧΗ: το id πρέπει να αντικατασταθεί με το πραγματικό namespace id από το
# Cloudflare dashboard (Workers & Pages → KV → Create namespace "a2l-checks"),
# και το binding να προστεθεί και στο Pages project (Settings → Functions → KV).
# Χωρίς αυτό ο έλεγχος δουλεύει κανονικά, απλώς χωρίς μόνιμο σύνδεσμο και χωρίς
# όριο συχνότητας — βλ. functions/api/check.js.
[[kv_namespaces]]
binding = "CHECKS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
