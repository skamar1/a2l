# Ρυθμίσεις για ΤΟΠΙΚΗ ανάπτυξη μόνο (`wrangler pages dev`).
#
# ΠΡΟΣΟΧΗ — μην προσθέσεις `pages_build_output_dir` εδώ.
#
# Η παρουσία εκείνου του κλειδιού είναι ο διακόπτης που κάνει το Cloudflare
# Pages να διαβάζει αυτό το αρχείο ως τη μοναδική πηγή αλήθειας. Από εκείνη τη
# στιγμή τα αντίστοιχα πεδία στο dashboard γίνονται read-only, οπότε τα secrets
# που είναι ήδη περασμένα εκεί (TURNSTILE_SECRET_KEY, SMTP2GO_API_KEY — τα
# χρησιμοποιεί η φόρμα επικοινωνίας στο functions/api/contact.js) θα έπρεπε να
# ξαναδηλωθούν με το χέρι. Δεν αξίζει το ρίσκο σε ζωντανό site.
#
# Το binding του KV μπαίνει από το dashboard:
#   Workers & Pages → a2l → Settings → Bindings → Add → KV namespace
#   Variable name: CHECKS   (όχι a2l_checks — ο κώδικας διαβάζει env.CHECKS)
#   Namespace:     a2l-checks — id f43ce70f9c8d4120b9a59439e67644e3
# (και μετά redeploy, αλλιώς το binding δεν ενεργοποιείται)
#
# Τοπικά, το namespace προσομοιώνεται με τη σημαία --kv (δεν χρειάζεται id).
# Το Turnstile είναι fail-closed, οπότε χρειάζεται και το δοκιμαστικό κλειδί
# της Cloudflare (περνάει πάντα την επαλήθευση):
#   npx wrangler pages dev public --kv CHECKS \
#     --binding TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA

name = "a2l"
compatibility_date = "2026-01-01"
