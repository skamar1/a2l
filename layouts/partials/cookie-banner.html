<div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Ειδοποίηση cookies">
  <p class="cookie-banner__text">
    Χρησιμοποιούμε cookies που είναι απαραίτητα για τη σωστή λειτουργία του site.
    <a href="/politiki-cookies/" class="cookie-banner__link">Πολιτική Cookies</a>
  </p>
  <button id="cookie-accept" class="cookie-banner__btn">Εντάξει</button>
</div>

<script>
  (function() {
    if (localStorage.getItem('cookies-ok')) return;
    document.getElementById('cookie-banner').classList.add('cookie-banner--visible');
    document.getElementById('cookie-accept').addEventListener('click', function() {
      localStorage.setItem('cookies-ok', '1');
      document.getElementById('cookie-banner').classList.remove('cookie-banner--visible');
    });
  })();
</script>
