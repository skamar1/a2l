{{ define "main" }}
<div class="page-content">
  <div class="container">
    <article class="article">
      <header class="article__header">
        <div class="article__meta">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
          {{ with .Params.category }}<span class="badge">{{ . }}</span>{{ end }}
          {{ with .Params.author }}<span>{{ . }}</span>{{ end }}
        </div>
        <h1 class="article__title">{{ .Title }}</h1>
        {{ with .Description }}<p class="section-subtitle">{{ . }}</p>{{ end }}
      </header>

      {{ with .Params.image }}
        <img src="{{ . }}" alt="{{ $.Title }}" class="post__hero-img" loading="lazy">
      {{ end }}

      <div class="article__body">
        {{ .Content }}
      </div>

      <div class="post__nav">
        <a href="/odigies-nea/" class="btn btn--outline">← Πίσω στα Νέα</a>
        <a href="/epikoinonia/" class="btn btn--primary">Επικοινωνία</a>
      </div>
    </article>
  </div>
</div>
{{ end }}
