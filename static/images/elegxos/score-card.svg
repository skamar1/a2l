<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="Ενδεικτική απεικόνιση αναφοράς ελέγχου: συνολικός βαθμός στα 100 και επιμέρους βαθμολογία σε έξι κατηγορίες">
  <defs>
    <linearGradient id="scGauge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="scShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .lbl { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: #4f46e5; }
      .sub { font-size: 13px; font-weight: 500; fill: #9ca3af; }
      .num { font-size: 64px; font-weight: 700; fill: #111827; }
      .of  { font-size: 16px; font-weight: 600; fill: #9ca3af; }
      .cat { font-size: 14px; font-weight: 600; fill: #374151; }
      .note{ font-size: 11.5px; font-weight: 500; fill: #9ca3af; }
    </style>
  </defs>

  <!-- κάρτα -->
  <g filter="url(#scShadow)">
    <rect x="20" y="20" width="520" height="520" rx="24" fill="#ffffff" stroke="#e5e7eb"/>
  </g>

  <text class="t lbl" x="60" y="68">A2 SITE CHECK</text>
  <text class="t sub" x="60" y="90">Αναφορά ελέγχου ιστοσελίδας</text>

  <!-- ── δείκτης συνολικού βαθμού ──────────────────────── -->
  <path d="M 170 230 A 110 110 0 0 1 390 230" fill="none" stroke="#eef2ff" stroke-width="18" stroke-linecap="round"/>
  <path d="M 170 230 A 110 110 0 0 1 380.96 186.32" fill="none" stroke="url(#scGauge)" stroke-width="18" stroke-linecap="round"/>
  <text class="t num" x="280" y="212" text-anchor="middle">87</text>
  <text class="t of"  x="280" y="236" text-anchor="middle">/100</text>

  <!-- ── κατηγορίες ────────────────────────────────────── -->
  <g>
    <text class="t cat" x="60" y="309">Ασφάλεια</text>
    <rect x="230" y="300" width="240" height="10" rx="5" fill="#f3f4f6"/>
    <rect x="230" y="300" width="216" height="10" rx="5" fill="url(#scGauge)"/>
    <path d="M492 305 l4 4 l8 -9" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <text class="t cat" x="60" y="345">SEO &amp; ευρετηρίαση</text>
    <rect x="230" y="336" width="240" height="10" rx="5" fill="#f3f4f6"/>
    <rect x="230" y="336" width="187" height="10" rx="5" fill="url(#scGauge)"/>

    <text class="t cat" x="60" y="381">Δεδομένα &amp; AI</text>
    <rect x="230" y="372" width="240" height="10" rx="5" fill="#f3f4f6"/>
    <rect x="230" y="372" width="149" height="10" rx="5" fill="url(#scGauge)"/>

    <text class="t cat" x="60" y="417">Απόδοση</text>
    <rect x="230" y="408" width="240" height="10" rx="5" fill="#f3f4f6"/>
    <rect x="230" y="408" width="204" height="10" rx="5" fill="url(#scGauge)"/>
    <path d="M492 413 l4 4 l8 -9" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <text class="t cat" x="60" y="453">Προσβασιμότητα</text>
    <rect x="230" y="444" width="240" height="10" rx="5" fill="#f3f4f6"/>
    <rect x="230" y="444" width="168" height="10" rx="5" fill="url(#scGauge)"/>

    <text class="t cat" x="60" y="489">Εμπιστοσύνη</text>
    <rect x="230" y="480" width="240" height="10" rx="5" fill="#f3f4f6"/>
    <rect x="230" y="480" width="228" height="10" rx="5" fill="url(#scGauge)"/>
    <path d="M492 485 l4 4 l8 -9" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text class="t note" x="280" y="522" text-anchor="middle">Ενδεικτική απεικόνιση — δεν αφορά πραγματικό έλεγχο.</text>
</svg>
