<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-label="Σύγκριση: Χωρίς αυτόματο συρτάρι υπάρχουν λάθη στα ρέστα, πλαστά και καθυστερήσεις, ενώ με το αυτόματο συρτάρι έχετε 100% ακρίβεια, ασφάλεια και απόλυτη υγιεινή">
  <defs>
    <linearGradient id="csGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="csShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .lb  { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .rw  { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .rwd { font-size: 14px; font-weight: 600; fill: #475569; }
      .ft  { font-size: 12.5px; font-weight: 500; }
    </style>
  </defs>

  <!-- ── ΧΩΡΙΣ ΑΥΤΟΜΑΤΟ ΣΥΡΤΑΡΙ ───────────────────────────── -->
  <g filter="url(#csShadow)">
    <rect x="8" y="8" width="424" height="394" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="8" y="8" width="424" height="52" rx="20" fill="#f1f5f9"/>
  <rect x="8" y="44" width="424" height="16" fill="#f1f5f9"/>
  <text class="t lb" x="32" y="41" fill="#64748b">ΠΑΡΑΔΟΣΙΑΚΟ ΣΥΡΤΑΡΙ</text>
  <text class="t ft" x="32" y="86" fill="#94a3b8">Χειροκίνητη διαχείριση &amp; καθημερινό ρίσκο:</text>

  <g>
    <rect x="32" y="102" width="376" height="42" rx="12" fill="#fff1f2" stroke="#ffe4e6"/>
    <circle cx="56" cy="123" r="11" fill="#fecdd3"/>
    <path d="M51 118 l10 10 M61 118 l-10 10" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <text class="t rwd" x="80" y="128">Λάθη στα ρέστα &amp; ελλείμματα βάρδιας</text>

    <rect x="32" y="152" width="376" height="42" rx="12" fill="#fff1f2" stroke="#ffe4e6"/>
    <circle cx="56" cy="173" r="11" fill="#fecdd3"/>
    <path d="M51 168 l10 10 M61 168 l-10 10" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <text class="t rwd" x="80" y="178">Κίνδυνος αποδοχής πλαστών χαρτονομισμάτων</text>

    <rect x="32" y="202" width="376" height="42" rx="12" fill="#fff1f2" stroke="#ffe4e6"/>
    <circle cx="56" cy="223" r="11" fill="#fecdd3"/>
    <path d="M51 218 l10 10 M61 218 l-10 10" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <text class="t rwd" x="80" y="228">Επαφή με χρήματα &amp; τρόφιμα (μικρόβια)</text>

    <rect x="32" y="252" width="376" height="42" rx="12" fill="#fff1f2" stroke="#ffe4e6"/>
    <circle cx="56" cy="273" r="11" fill="#fecdd3"/>
    <path d="M51 268 l10 10 M61 268 l-10 10" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <text class="t rwd" x="80" y="278">Εκτεθειμένα μετρητά &amp; κίνδυνος κλοπής</text>

    <rect x="32" y="302" width="376" height="42" rx="12" fill="#fff1f2" stroke="#ffe4e6"/>
    <circle cx="56" cy="323" r="11" fill="#fecdd3"/>
    <path d="M51 318 l10 10 M61 318 l-10 10" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <text class="t rwd" x="80" y="328">30–45 λεπτά μέτρημα στο κλείσιμο (Ζ)</text>
  </g>
  <text class="t ft" x="32" y="378" fill="#e11d48" font-weight="600">Άγχος, οικονομικές απώλειες και καθυστερήσεις.</text>

  <!-- ── ΒΕΛΟΣ ──────────────────────────────────────────── -->
  <circle cx="500" cy="205" r="26" fill="url(#csGrad)"/>
  <path d="M490 205 h18 m-6 -6 l6 6 l-6 6" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ── ΜΕ ΑΥΤΟΜΑΤΟ ΣΥΡΤΑΡΙ ────────────────────────────── -->
  <g filter="url(#csShadow)">
    <rect x="568" y="8" width="424" height="394" rx="20" fill="#ffffff" stroke="#bae6fd"/>
  </g>
  <rect x="568" y="8" width="424" height="52" rx="20" fill="url(#csGrad)"/>
  <rect x="568" y="44" width="424" height="16" fill="#0369a1"/>
  <text class="t lb" x="592" y="41" fill="#ffffff">ΜΕ ΑΥΤΟΜΑΤΟ ΣΥΡΤΑΡΙ ICS &amp; A2L</text>
  <text class="t ft" x="592" y="86" fill="#0284c7">100% αυτόματο, ασφαλές και ακριβές:</text>

  <g>
    <rect x="592" y="102" width="376" height="42" rx="12" fill="#f0fdf4" stroke="#dcfce7"/>
    <circle cx="616" cy="123" r="11" fill="#bbf7d0"/>
    <path d="M611 123 l4 4 l8 -9" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text class="t rw" x="640" y="128">100% ακριβή ρέστα — μηδέν αποκλίσεις</text>

    <rect x="592" y="152" width="376" height="42" rx="12" fill="#f0fdf4" stroke="#dcfce7"/>
    <circle cx="616" cy="173" r="11" fill="#bbf7d0"/>
    <path d="M611 173 l4 4 l8 -9" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text class="t rw" x="640" y="178">Αυτόματη ανίχνευση πλαστότητας (ECB)</text>

    <rect x="592" y="202" width="376" height="42" rx="12" fill="#f0fdf4" stroke="#dcfce7"/>
    <circle cx="616" cy="223" r="11" fill="#bbf7d0"/>
    <path d="M611 223 l4 4 l8 -9" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text class="t rw" x="640" y="228">Απόλυτη υγιεινή: καμία επαφή με μετρητά</text>

    <rect x="592" y="252" width="376" height="42" rx="12" fill="#f0fdf4" stroke="#dcfce7"/>
    <circle cx="616" cy="273" r="11" fill="#bbf7d0"/>
    <path d="M611 273 l4 4 l8 -9" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text class="t rw" x="640" y="278">Μετρητά κλειδωμένα σε χρηματοκιβώτιο</text>

    <rect x="592" y="302" width="376" height="42" rx="12" fill="#f0fdf4" stroke="#dcfce7"/>
    <circle cx="616" cy="323" r="11" fill="#bbf7d0"/>
    <path d="M611 323 l4 4 l8 -9" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text class="t rw" x="640" y="328">Αυτόματο κλείσιμο ταμείου σε 1 λεπτό</text>
  </g>
  <text class="t ft" x="592" y="378" fill="#16a34a" font-weight="700">Απόλυτη ασφάλεια, εξοικονόμηση χρόνου &amp; ηρεμία.</text>
</svg>
