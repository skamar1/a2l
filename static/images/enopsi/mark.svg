<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Εν Όψει">
  <!-- Το σήμα είναι το Ό του ονόματος: ο κύκλος του όμικρον διαβάζεται ταυτόχρονα ως
       φακός, και μέσα του φαίνονται τα νούμερα — «εν όψει». Ο τόνος από πάνω δεν είναι
       διακόσμηση· είναι το γράμμα. Χωρίς διαβαθμίσεις και σκιές, ώστε να τυπώνεται και
       να στέκει σε μαύρο ή λευκό φόντο. -->
