  </g>
  <g fill="#06231C">
    <rect x="12.9" y="20.2" width="2.1" height="2.6" rx="1"/>
    <rect x="14.95" y="18.4" width="2.1" height="4.4" rx="1"/>
    <rect x="17" y="16.4" width="2.1" height="6.4" rx="1"/>
  </g>
</svg>
