      - heading "Πολιτική Cookies" [level=1] [ref=e22]
      - generic [ref=e23]:
        - heading "Τι είναι τα Cookies" [level=2] [ref=e24]
        - paragraph [ref=e25]: Τα cookies είναι μικρά αρχεία κειμένου που αποθηκεύονται στον υπολογιστή ή στη συσκευή σας όταν επισκέπτεστε έναν ιστότοπο. Χρησιμοποιούνται ευρέως για να κάνουν τους ιστότοπους να λειτουργούν αποτελεσματικά και για να παρέχουν πληροφορίες στους ιδιοκτήτες τους.
        - heading "Ποια Cookies Χρησιμοποιούμε" [level=2] [ref=e26]
        - heading "Απαραίτητα Cookies" [level=3] [ref=e27]
        - paragraph [ref=e28]: Αυτά τα cookies είναι απαραίτητα για τη βασική λειτουργία του ιστότοπου και δεν μπορούν να απενεργοποιηθούν. Συνήθως ορίζονται μόνο ως απόκριση σε ενέργειες που πραγματοποιείτε εσείς, όπως η ρύθμιση προτιμήσεων απορρήτου, η σύνδεση ή η συμπλήρωση φορμών.
        - heading "Cookies Ανάλυσης / Επιδόσεων" [level=3] [ref=e29]
        - paragraph [ref=e30]: Αυτά τα cookies μας επιτρέπουν να μετράμε και να βελτιώνουμε τις επιδόσεις του ιστότοπού μας. Μας βοηθούν να κατανοούμε πώς οι επισκέπτες αλληλεπιδρούν με τον ιστότοπο, συλλέγοντας και αναφέροντας πληροφορίες ανωνύμως.
        - heading "Πώς να Ελέγξετε τα Cookies" [level=2] [ref=e31]
        - paragraph [ref=e32]: Μπορείτε να ρυθμίσετε το πρόγραμμα περιήγησής σας ώστε να απορρίπτει όλα ή ορισμένα cookies, ή να σας ειδοποιεί όταν οι ιστότοποι ορίζουν ή αποκτούν πρόσβαση σε cookies. Εάν απενεργοποιήσετε ή απορρίψετε cookies, σημειώστε ότι ορισμένα τμήματα αυτού του ιστότοπου ενδέχεται να καταστούν μη προσβάσιμα ή να μην λειτουργούν σωστά.
        - paragraph [ref=e33]: "Για περισσότερες πληροφορίες σχετικά με τη διαχείριση cookies στο πρόγραμμα περιήγησής σας, επισκεφθείτε:"
