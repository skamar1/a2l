              - generic [ref=e156]: Διευθύνων Σύμβουλος
              - paragraph [ref=e157]: Η ανάγκη μας για μία αξιόπιστη λειτουργική λύση και ένα εργαλείο που να ανταποκρίνεται άμεσα με ταχύτητα στον χώρο της εντατικής λιανικής μας οδήγησε στην επιλογή του λογισμικού DRS και του Back Office Result Business C.R.M. – E.R.P. της Dynasoft. Εξοπλίσαμε τα ταμεία μας σε όλα τα καταστήματα μας, δημιουργήσαμε πανομοιότυπες λειτουργίες για κάθε ταμείο, δικαιώματα και έλεγχο χειριστών ταμείων, οργανώσαμε τους τιμοκαταλόγους μας, προσδώσαμε ευελιξία συνεχούς ενημέρωσης στις τιμές και τα είδη μας, οργανώσαμε το πρόγραμμα επιβράβευσης των πελατών μας (Loyalty) και συγκεντρώσαμε τις αναφορές πωλήσεων όλων των ταμείων στο κεντρικό μας σύστημα.
