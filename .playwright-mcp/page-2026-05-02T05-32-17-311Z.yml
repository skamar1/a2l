              - generic [ref=e147]: Ιδιοκτήτη της επιχείρησης
              - paragraph [ref=e148]: Οι αυξημένες ανάγκες για ενοποιημένες λειτουργίες, διαδικασίες και πληροφόρηση στην παραγωγή και την ιχνηλασιμότητα καθώς και η συνεχώς αναπτυσσόμενη πορεία της επιχείρησής μας, συνέτειναν στην αντικατάσταση του μηχανογραφικού μας συστήματος. Με το λογισμικό Result Business C.R.M. - E.R.P. καταφέραμε επιτυχώς χωρίς προβλήματα να μεταβούμε στο νέο περιβάλλον, με χαμηλό κόστος αναβαθμισμένες λειτουργίες και αυξημένες δυνατότητες.
