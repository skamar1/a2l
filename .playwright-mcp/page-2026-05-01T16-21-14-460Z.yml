    - generic [ref=e68]:
      - heading "ΕΦΑΡΜΟΓΗ RESULT CRM" [level=2] [ref=e76]
      - generic [ref=e86]:
        - heading "Result Base" [level=2] [ref=e89]
        - heading "To Result Base είναι η βασική έκδοση του προγράμματος Result. Απευθύνεται κυρίως σε μικρές επιχειρήσεις που θέλουν να ανταγωνιστούν και να έχουν την μέγιστη δυνατή παραγωγικότητα για την επιχείρησή τους. Εξοικονόμηση χρόνου, ταχύτητα και απλότητα. Αυτά χαρακτηρίζουν την έκδοση αυτή. Πλήρης για να καλύψει όλες σας τις απαιτήσεις. Επιπλέον, μπορεί να προσαρμοσθεί στις δικές σας επιλογές και ανάγκες με μεγάλη ευκολία. Επίσης, το Result Base, περιλαμβάνει Υποσύστημα Διαχείρισης Πελατειακών Σχέσεων(CRM), ένα ισχυρό εργαλείο που σας επιτρέπει να διαχειριστείτε, να οργανώσετε και να παρακολουθείτε τις πελατειακές σας σχέσεις, καθώς κάθε εξουσιοδοτημένο στέλεχος έχει πρόσβαση σε όλες τις καθημερινές πληροφορίες που χρειάζεται για τον εκάστοτε πελάτη." [level=2] [ref=e92]
        - heading "Σε ποιούς απευθύνεται;" [level=2] [ref=e95]
        - heading "Το Result Base απευθύνεται κυρίως σε εταιρίες που δραστηριοποιούνται στην Χονδρική, Εμπορικές επιχειρήσεις,αλλά και εταιρίες που παρέχουν υπηρεσίες." [level=2] [ref=e98]
      - generic [ref=e102]:
        - heading "Result Business" [level=2] [ref=e105]
        - heading "Το Result Business είναι μία δοκιμασμένη λύση και αποτελεί την απάντηση σε όλα τα προβλήματα της μικρής και μεσαίας επιχείρησης. Service Management, Production Management, Reporting, Package Management είναι μόνο μερικά από τα πανίσχυρα εργαλεία που προσφέρει." [level=2] [ref=e108]
        - heading "Σε ποιούς απευθύνεται;" [level=2] [ref=e111]
        - heading "Το εξαιρετικά φιλικό περιβάλλον του Result Business Καθώς και η δυνατότητα προσαρμογής στις ανάγκες της εκάστοτε εταιρίας το καθιστούν σημαντικό πλεονέκτημα για κάθε επιχείρηση. Το Result Business απευθύνεται κυρίως σε εταιρίες που δραστηριοποιούνται στη χονδρική πώληση, σε εμπορικές επιχειρήσεις, επιχειρήσεις παροχής υπηρεσιών. Είναι ιδανικό για παρακολούθηση περιοδικών εργασιών και διαχείρηση μεγάλου όγκου διανομών." [level=2] [ref=e114]
      - generic [ref=e130]:
        - heading "Result Advance" [level=2] [ref=e133]
        - heading "Το Result Advance αποτελεί το πλέον ολοκληρωμένο εργαλείο ανάπτυξης και λήψης αποφάσεων για κάθε μεσαία και μεγάλη εμπορική ή βιομηχανική επιχείρηση. Πρόκειται για ένα πρωτοποριακό λογισμικό, αποτέλεσμα της πολυετούς εμπειρίας και τεχνογνωσίας της Dynasoft. Προσαρμόζεται και αναδιοργανώνεται έτσι ώστε να καλύπτει κάθε πιθανή ανάγκη της επιχείρησής σας. Λειτουργίες όπως Cloud Server, E-mail Server, Customer Web Access και Web Site Control σε συνδυασμό με όλες τις δυνατότητες του Result Business Pro καθιστούν το Result Advance το τέλειο εργαλείο για την επιχείρηση σας." [level=2] [ref=e136]
        - heading "Σε ποιούς απευθύνεται;" [level=2] [ref=e139]
        - 'heading "Μεγάλη βαρύτητα έχει δοθεί στην απλότητα και στην ευχρηστία του Result Advance. Οι πολλαπλές επιλογές του βρίσκονται στο background κι έτσι ο χρήστης δεν χρειάζεται να πληκτρολογεί ή να βλέπει περιττές πληροφορίες. Το Result Advance απευθύνεται σε επιχειρήσεις με δραστηριότητες όπως: Βιομηχανική Παραγωγή, Παροχή Υπηρεσιών και Εμπορικές Επιχειρήσεις." [level=2] [ref=e142]'
