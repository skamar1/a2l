        - paragraph [ref=e27]: "Το σύνολο ενεργειών που απαιτούνται ως προς τη διαχείριση νέας χρήσης στο Plano: άνοιγμα χρήσης και μεταφορά υπολοίπων."
      - img "PLANO – Έναρξη Χρήσης & Μεταφοράς Υπολοίπων" [ref=e28]
      - generic [ref=e29]:
        - heading "Ενέργειες Ανοίγματος Χρήσης" [level=2] [ref=e30]
        - heading "Εισαγωγή" [level=3] [ref=e31]
        - paragraph [ref=e32]: Στο παρόν κείμενο περιγράφεται το σύνολο ενεργειών που απαιτούνται ως προς τη διαχείριση νέας χρήσης.
        - heading "Άνοιγμα Χρήσης" [level=3] [ref=e33]
        - paragraph [ref=e34]:
          - text: Στο μενού
          - strong [ref=e35]: Ρυθμίσεις – Εταιρία – Χρήσεις
          - text: εμφανίζονται αριστερά όλες οι χρήσεις, και δεξιά όλη η παραμετροποίηση που αφορά την κάθε μία από αυτές τις χρήσεις. Για την δημιουργία μιας νέας χρήσης, επιλέγετε προσθήκη από το σχετικό σύμβολο κάτω αριστερά και θα πρέπει να συμπληρωθούν τα πεδία δεξιά όπως απεικονίζεται στο παράδειγμα.
        - list [ref=e36]:
          - listitem [ref=e37]:
            - strong [ref=e38]: "Εισαγωγή:"
            - text: Από το εικονίδιο των ρυθμίσεων.
          - listitem [ref=e39]: Επιλέγουμε εταιρεία και χρήση.
        - paragraph [ref=e40]:
          - img "Άνοιγμα χρήσης - βήμα 1" [ref=e41]
        - paragraph [ref=e42]:
          - text: Υποχρεωτικά πρέπει να συμπληρωθεί ο
          - strong [ref=e43]: Κωδικός
          - text: και το
          - strong [ref=e44]: Όνομα
          - text: της χρήσης. Οι ημερομηνίες Έναρξης και Λήξης προτείνονται από το σύστημα αλλά μπορείτε να τις τροποποιήσετε.
        - paragraph [ref=e45]:
          - text: Επίσης υποχρεωτικό είναι το πεδίο
          - strong [ref=e46]: Νόμισμα
          - text: .
        - paragraph [ref=e47]:
          - text: Στη συνέχεια θα πρέπει να δημιουργηθούν οι Περίοδοι με την επιλογή
          - strong [ref=e48]: ΜΗΝΙΑΙΕΣ ΠΕΡΙΟΔΟΙ
          - text: ", οπότε θα ανοίξουν αυτόματα οι περίοδοι σε επίπεδο μήνα, είτε χειροκίνητα οπότε μπορείτε να διαφοροποιήσετε τις περιόδους όπως εσείς επιθυμείτε."
        - paragraph [ref=e49]:
          - img "Ρυθμίσεις χρήσης" [ref=e50]
        - paragraph [ref=e51]: "Στο tab: Λογιστική, θα πρέπει να ορίσετε την κατηγορία βιβλίων και τα Λογιστικά Συστήματα που θα χρησιμοποιηθούν σε αυτή τη χρήση. Είναι προαιρετικό και δεν χρησιμοποιείτε στην παρούσα φάση."
        - paragraph [ref=e52]:
          - text: Για την ολοκλήρωση της δημιουργίας Χρήσης, επιλέγετε
          - strong [ref=e53]: Αποθήκευση
          - text: .
        - heading "Διαδικασία Μεταφοράς Υπολοίπων" [level=2] [ref=e54]
        - paragraph [ref=e55]:
          - text: Από το μενού
          - strong [ref=e56]: Ρυθμίσεις – Εταιρία – Μεταφορά Υπολοίπων
          - text: εκτελείτε την ενέργεια της μεταφοράς, ώστε να εμφανίζονται τα υπόλοιπα της εκάστοτε οντότητας (πελάτων, προμηθευτών, ειδών, χρεωστών, πιστωτών) στη νέα χρήση.
        - paragraph [ref=e57]:
          - img "Μεταφορά υπολοίπων - επιλογές" [ref=e58]
        - paragraph [ref=e59]:
          - text: Η μεταφορά υπολοίπων καλό είναι να εκτελείται αφού έχουν συμφωνηθεί τα υπόλοιπα στο τέλος της χρήσης.
          - strong [ref=e60]: Σε περίπτωση που μετά την ενέργεια αυτή γίνουν επιπλέον κινήσεις στην προηγούμενη χρήση, που επηρεάζουν αποθήκη ή συν/νους, τότε η ενέργεια αυτή θα πρέπει να εκτελεστεί εκ νέου αφού διαγραφούν οι κινήσεις που έχουν δημιουργηθεί σε κάθε οντότητα.
          - text: "Η συγκεκριμένη ενέργεια παράγει παραστατικά ανάλογα με τις επιλογές που θα κάνετε:"
        - paragraph [ref=e61]:
          - img "Παράμετροι μεταφοράς υπολοίπων" [ref=e62]
        - paragraph [ref=e63]:
          - text: Στο πεδίο
          - strong [ref=e64]: “Χρήση από”
          - text: εμφανίζεται η χρήση από την οποία θέλετε να μεταφερθούν τα υπόλοιπα, ενώ στο
          - strong [ref=e65]: “Χρήση σε”
          - text: ποια χρήση θα ενημερώσει. Στο πεδίο
          - strong [ref=e66]: “Ημερομηνία”
          - text: ορίζετε την ημερομηνία που θα δημιουργηθεί το παραστατικό της μεταφοράς των υπολοίπων — θα πρέπει να είναι 01/01 της χρήσης που θα μεταφερθούν.
        - paragraph [ref=e67]:
          - text: Στη μεταφορά μπορεί να επιλεχθεί συγκεκριμένη οντότητα π.χ. Είδη αποθήκης ή η ένδειξη
          - strong [ref=e68]: όλα
          - text: . Για την ενότητα που θέλουμε να μεταφέρουμε θα πρέπει να ενεργοποιήσουμε το αντίστοιχο πεδίο
          - strong [ref=e69]: “Μεταφορά”
          - text: . Στο πεδίο
          - strong [ref=e70]: “Τύπος Παραστατικού”
          - text: για τα είδη της αποθήκης μπορείτε να επιλέξετε αν θα μεταφερθούν μόνο οι ποσότητες, μόνο οι αξίες ή και τα δύο με το παραστατικό που θα δημιουργηθεί. Στο πεδίο
          - strong [ref=e71]: “Αποθήκες”
          - text: ", μπορείτε να επιλέξετε τις αποθήκες για τις οποίες θα εκτελεστεί η ενέργεια. Στο πεδίο"
          - strong [ref=e72]: “Σειρά Παραστατικού”
          - text: ", ορίζετε την σειρά για το παραστατικό που θα προκύψει. Για τους συν/μένους θα πρέπει να επιλεχθεί τύπος Παραστατικού"
          - strong [ref=e73]: “Χρέωσης”
          - text: και
          - strong [ref=e74]: “Πίστωσης”
          - text: καθώς και την αντίστοιχη σειρά.
