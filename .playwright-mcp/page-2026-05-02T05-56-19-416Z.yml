          - generic [ref=e400]:
            - generic [ref=e402]: "\"Η οργάνωση της επιχείρησής μας απαιτεί αυστηρά πρωτόκολλα κωδικοποίησης, ιχνηλασιμότητας, printing reports και ευελιξίας. Μόνο έτσι μπορούμε να εστιάζουμε στη δουλειά μας και να κοιτάζουμε το μέλλον στα μάτια. Το PRISMA Win -και φυσικά ο συνεργάτης μας από τη Mega Support- ανταποκρίθηκε στις προκλήσεις που θέσαμε, με αποτέλεσμα να έχουμε σήμερα ένα ολοκληρωμένο σύστημα διαχείρισης, αρωγό στην ανάπτυξη της εταιρείας!\""
