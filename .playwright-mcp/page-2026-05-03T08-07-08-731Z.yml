  - generic [ref=e148]:
    - heading "Διαχείριση ανθρώπινου δυναμικού" [level=2] [ref=e149]
    - paragraph
    - img "iStock_000054378336_Largetiny" [ref=e150]
    - paragraph [ref=e151]:
      - text: Η εφαρμογή SOFT1 HRMS προσφέρει όλα όσα χρειάζεται η επιχείρησή σας για την ανάπτυξη ενός ανταγωνιστικού εργασιακού περιβάλλοντος με σύγχρονα και ευέλικτα μοντέλα εργασίας, που αυξάνουν την παραγωγικότητα και μειώνουν το κόστος διαχείρισης των ανθρώπων σας. H λύση της ENTERSOFTONE καλύπτει με τον πλέον αποτελεσματικό τρόπο τις ιδιαίτερες απαιτήσεις λειτουργίας ενός τμήματος HR, παρέχοντας άμεση και ασφαλή πρόσβαση σε ακριβείς πληροφορίες που βοηθούν τη λήψη τεκμηριωμένων αποφάσεων.
      - text: Το SOFT1 HRMS περιλαμβάνει ολοκληρωμένο αρχείο στελεχών με απεριόριστες δυνατότητες καταχώρησης προσωπικών και επαγγελματικών στοιχείων, υποστηρίζοντας παράλληλα την παρακολούθηση κάθε στοιχείου εξέλιξης των εργαζομένων. Ενσωματώνοντας εξειδικευμένη λειτουργικότητα, επιτρέπει στα τμήματα HR να εντοπίζουν κατάλληλους υποψηφίους για καίριες θέσεις εργασίας, καθώς επίσης να αξιολογούν την απόδοση κάθε εργαζόμενου αναφορικά με τις απαιτήσεις της εργασίας του, τη συνεργασία με τους συναδέλφους του, τη συμπεριφορά και την κατανόηση του ρόλου του στην εταιρεία.
      - text: Σε πλήρη διασύνδεση με την πρωτοποριακή πλατφόρμα αλληλεπίδρασης εργαζομένων-επιχείρησης,
      - link "SOFT1 myWorkplace" [ref=e152] [cursor=pointer]:
        - /url: https://www.softone.gr/myworkplace/
      - text: ", η εφαρμογή SOFT1 HRMS κάνει πράξη τον ψηφιακό μετασχηματισμό όλων των λειτουργιών της διαχείρισης ανθρώπινου δυναμικού, επιτυγχάνοντας την εξάλειψη παραδοσιακών, χειρόγραφων διαδικασιών αλλά και τη βελτιστοποίηση λειτουργιών, καθώς όλοι οι εργαζόμενοι αφιερώνουν περισσότερο χρόνο σε εργασίες που προσδίδουν αξία στην εταιρεία."
    - paragraph [ref=e153]
    - paragraph
