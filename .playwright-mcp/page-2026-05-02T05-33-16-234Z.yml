          - strong [ref=e43]: είναι πρωτοποριακό και πλήρες Πληροφοριακό Σύστημα Διαχείρισης Σχέσεων Πελατών (C.R.M.) και Αξιοποίησης Επιχειρησιακών Πόρων (E.R.P.), ένα δυναμικό μοντέλο μηχανογράφησης με ουσιαστικά οφέλη και πλεονεκτήματα για τη σύγχρονη επιχείρηση.
        - paragraph [ref=e44]:
          - strong [ref=e45]: Τεχνολογικά προηγμένο λογισμικό που ενοποιεί τις λειτουργίες όλων των τμημάτων, παρέχοντας ενιαία C.R.M. και E.R.P. λειτουργικότητα, ενώ παράλληλα εκμεταλλεύεται, συνδυάζει και αξιοποιεί πληροφορίες που αφορούν στην επιχείρηση συνολικά.
