                - text: επιχειρήσεις που έχουν αυξημένες απαιτήσεις παρακολούθησης περιοδικών εργασιών (π.χ. περιοδική συντήρηση κλιματιστικών), σε διάφορους κλάδους της αγοράς ενδεικτικά όπως
                - strong [ref=e212]: ": τυποποιήμένων και μη τροφίμων – ποτών, συσκευές, μηχανήματα, οχήματα, εξαρτήματα, εργαλεία, χρώματα – βερνίκια, χημικά – φάρμακα, αρώματα- καλλυντικά, ανταλλακτικά, αναλώσιμα κ.α"
