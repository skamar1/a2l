          - strong [ref=e57]: Result
          - strong [ref=e58]: C.R.M.
          - text: είναι το σύστημα δυναμικών διεργασιών, λειτουργιών και δυνατοτήτων που είναι επικεντρωμένο στον πελάτη και μεθοδικά δομημένο ώστε να παράσχει άριστα οργανωμένη πληροφόρηση για τις ανάγκες του.
        - paragraph [ref=e59]: Προσεγγίστε και τοποθετήστε τον πελάτη στο κέντρο της επιχειρηματικής διαδικασίας.
        - paragraph [ref=e60]: Προσελκύστε νέους πελάτες με κατάλληλες επιλογές δυνητικών πελατών, διατηρήστε και βελτιώστε την εξυπηρέτηση των ήδη πελατών σας, δημιουργήστε αφοσιωμένους πελάτες στα προϊόντα και υπηρεσίες σας, εξασφαλίστε διαχρονικές πωλήσεις μέσα από ένα ολοκληρωμένο πελατοκεντρικό σύστημα διαχείρισης.
        - paragraph [ref=e61]: Εντοπίστε, εξατομικεύστε και διαχειριστείτε τις ανάγκες των πελατών σας για να μεταβάλλετε τις επιχειρηματικές πρακτικές σας και να αυξήσετε την κερδοφορία της επιχείρησης.
