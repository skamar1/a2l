          - text: είναι ένα δοκιμασμένο, αξιόπιστο και πρωτοποριακό επιχειρησιακό λογισμικό, το οποίο ενσωματώνει όλη την τεχνογνωσία και πολυετή εμπειρία των στελεχών της Dynasoft, εξυπηρετεί όλες τις λειτουργίες της σύγχρονης επιχείρησης και επιπλέον προσαρμόζεται στις επιχειρηματικές πρακτικές της επιχείρησή σας.
        - paragraph [ref=e53]: "Αποδεδειγμένα αποτελεί την αξιόπιστη επιλογή για όλα τα μεγέθη εμπορικών, μεταποιητικών και επιχειρήσεων παροχής υπηρεσιών σημαντικών τομέων της αγοράς, όπως: Επιχειρήσεις Χονδρικής / Λιανικής (π.χ. τρόφιμα-ποτά, ένδυση-υπόδηση, αρώματα-καλλυντικά, εστίαση, ανταλλακτικά), Βιομηχανική / Βιοτεχνική παραγωγή, Εταιρίες Παροχής Υπηρεσιών (π.χ. επιχειρήσεις με after sale service), κάθετες και εξειδικευμένες αγορές, απαντώντας σε όλες τις σύγχρονες ανάγκες."
        - paragraph [ref=e54]: Μεγάλη σημασία από τους ανθρώπους της παραγωγής έχει δοθεί στην απλότητα και ευχρηστία της εφαρμογής, έτσι ώστε οι αναλυτικές πληροφορίες που διαθέτει το Result να βρίσκονται στο background και να αφήνουν τον χρήστη να βλέπει μόνο όποιες χρειάζεται.
        - paragraph [ref=e55]:
