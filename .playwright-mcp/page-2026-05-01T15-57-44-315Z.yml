      - generic [ref=e29]:
        - paragraph [ref=e30]: Όταν η ταμειακή μας χρειάζεται κάποιου είδους επισκευή τότε θα πρέπει να δηλώσουμε την βλάβη στην πλατφόρμα της εφορίας ESEND. Εδώ σας περιγράφουμε πως μπορείτε να το κάνετε αυτό.
