            - strong [ref=e40]: Νέα δήλωση προσωρινής βλάβης ΦΗΜ (10 ΗΜΕΡΕΣ ΜΑΧ)
            - text: .
          - listitem [ref=e41]:
            - text: Εκεί πρέπει να βάλουμε το σειριακό αριθμό της ταμειακής ή του φορολογικού μας μηχανισμού. Ο σειριακός αριθμός αποτελείται από
            - strong [ref=e42]: 3 γράμματα και 8 αριθμούς
