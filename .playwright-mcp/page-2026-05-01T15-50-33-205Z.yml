            - paragraph [ref=e81]: Όταν η ταμειακή μας χρειάζεται κάποιου είδους επισκευή τότε θα πρέπει να δηλώσουμε την βλάβη στην πλατφόρμα της εφορίας ESEND. Εδώ σας περιγράφουμε πως μπορείτε να το κάνετε αυτό.
            - list [ref=e82]:
              - listitem [ref=e83]:
                - text: Πηγαίνουμε στην σελίδα του
                - link "esend" [ref=e84] [cursor=pointer]:
