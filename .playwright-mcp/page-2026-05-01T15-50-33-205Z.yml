                - text: .
              - listitem [ref=e85]: Πατάμε το πλήκτρο Επιχειρήσεις.
              - listitem [ref=e86]: Στην σελίδα Σύνδεση Επιχείρησης βάζουμε τους κωδικούς μας του taxis (Όνομα χρήστη και Κωδικό πρόσβασης) και πατάμε Σύνδεση.
              - listitem [ref=e87]: Πατάμε την τελευταία επιλογή Βοηθητικά για δούμε τις διαθέσιμες επιλογές.
              - listitem [ref=e88]: Επιλέγομε Νέα δήλωση προσωρινής βλάβης ΦΗΜ (10 ΗΜΕΡΕΣ ΜΑΧ).
              - listitem [ref=e89]: Εκεί πρέπει να βάλουμε το σειριακό αριθμό της ταμειακής ή του φορολογικού μας μηχανισμού. (Ο σειριακός αριθμός αποτελείτε από 3 γράμματα και 8 αριθμούς. μπορούμε να τον βρούμε είτε σε ένα Ζ το γράφει στο τέλος του Ζ είτε πάνω στην ταμειακή – φορολογικό μηχανισμό σε μια ταμπέλα που έχει όπως θα δείτε και στις παρακάτω εικόνες.
              - listitem [ref=e90]: Μετά στο επόμενο πεδίο πρέπει να βάλουμε το ΑΦΜ της εταιρείας του εξουσιοδοτημένου τεχνικού που έχουμε.
              - listitem [ref=e91]: Αν θα γίνει μεταφορά πρέπει να βάλουμε και τον αριθμό του δελτίου αποστολής που θα κόψουμε. Αν δεν χρειάζεται μεταφορά τότε συμπληρώνουμε εκεί το αριθμό 0.
