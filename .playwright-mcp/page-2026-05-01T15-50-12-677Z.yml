              - heading "Ενέργειες Ανοίγματος Χρήσης" [level=3] [ref=e89]
              - list [ref=e90]:
                - listitem [ref=e91]:
                  - strong [ref=e92]: Εισαγωγή
                  - text: Στο παρόν κείμενο περιγράφεται το σύνολο ενεργειών που απαιτούνται ως προς τη διαχείριση νέας χρήσης.
                - listitem [ref=e93]:
                  - strong [ref=e94]: Άνοιγμα Χρήσης
                  - text: Στο μενού Ρυθμίσεις – Εταιρία – Χρήσεις εμφανίζονται αριστερά όλες οι χρήσεις, και δεξιά όλη η παραμετροποίηση που αφορά την κάθε μία από αυτές τις χρήσεις. Για την δημιουργία μιας νέας χρήσης, επιλέγετε προσθήκη από το σχετικό σύμβολο κάτω αριστερά και θα πρέπει να συμπληρωθούν τα πεδία δεξιά όπως απεικονίζεται στο παράδειγμα .
                - listitem [ref=e95]: Από το εικονίδιο των ρυθμίσεων.
              - list [ref=e96]:
                - listitem [ref=e97]: Επίλέγουμε εταιρεία και χρήση
            - generic [ref=e101]:
              - paragraph [ref=e102]:
                - text: Υποχρεωτικά πρέπει να συμπληρωθεί ο “
                - strong [ref=e103]: Κωδικός
                - text: ” και το “
                - strong [ref=e104]: Όνομα
                - text: ” της χρήσης. Οι ημερομηνίες Έναρξης και Λήξης προτείνονται από το σύστημα αλλά μπορείτε να τις τροποποιήσετε.
              - paragraph [ref=e105]:
                - text: Επίσης υποχρεωτικό είναι το πεδίο “
                - strong [ref=e106]: Νόμισμα
                - text: ”.
              - paragraph [ref=e107]:
                - text: Στη συνέχεια θα πρέπει να δημιουργηθούν οι Περίοδοι με την επιλογή “
                - strong [ref=e108]: ΜΗΝΙΑΙΕΣ ΠΕΡΙΟΔΟΙ
                - text: ”, οπότε θα ανοίξουν αυτόματα οι περίοδοι σε επίπεδο μήνα, είτε χειροκίνητα οπότε μπορείτε να διαφοροποιήσετε τις περιόδους όπως εσείς επιθυμείτε.
              - paragraph [ref=e109]: "Στο tab: Λογιστική, θα πρέπει να ορίσετε την κατηγορία βιβλίων και τα Λογιστικά Συστήματα που θα χρησιμοποιηθούν σε αυτή τη χρήση. Είναι προαιρετικό και δεν χρησιμοποιείτε στην παρούσα φάση ."
              - paragraph [ref=e110]:
                - text: Για την ολοκλήρωση της δημιουργίας Χρήσης, επιλέγετε “
                - strong [ref=e111]: Αποθήκευση
                - text: ”.
            - generic [ref=e115]:
              - heading "Διαδικασία Μεταφοράς Υπολοίπων" [level=3] [ref=e116]
              - paragraph [ref=e117]:
                - text: Από το μενού
                - strong [ref=e118]: Ρυθμίσεις – Εταιρία – Μεταφορά Υπολοίπων
                - text: εκτελείτε την ενέργεια της μεταφοράς , ώστε να εμφανίζονται τα υπόλοιπα της εκάστοτε οντότητας( πελάτων , προμηθευτών , ειδών ,χρεωστών , πιστωτών ) στη νέα χρήση.
            - paragraph [ref=e123]:
              - text: Η μεταφορά υπολοίπων καλό είναι να εκτελείται αφού έχουν συμφωνηθεί τα υπόλοιπα στο τέλος της χρήσης.
              - strong [ref=e124]: Σε περίπτωση που μετά την ενέργεια αυτή γίνουν επιπλέον κινήσεις στην προηγούμενη χρήση, που επηρεάζουν αποθήκη ή συν/νους , τότε η ενέργεια αυτή θα πρέπει να εκτελεστεί εκ νέου αφού διαγραφούν οι κινήσεις που έχουν δημιουργηθεί σε κάθε οντότητα
              - text: ". Η συγκεκριμένη ενέργεια παράγει παραστατικά ανάλογα με τις επιλογές που θα κάνετε όπως φαίνεται στο παράδειγμα παρακάτω :"
            - generic [ref=e128]:
              - paragraph [ref=e129]: Στο πεδίο “Χρήση από ” εμφανίζεται η χρήση από την οποία θέλετε να μεταφερθούν τα υπόλοιπα ενώ στο “Χρήση σε ” ποια χρήση θα ενημερώσει . Στο πεδίο “Ημερομηνία” ορίζετε την ημερομηνία που θα δημιουργηθεί το παραστατικό της μεταφοράς των υπολοίπων ,θα πρέπει να είναι 01/01 της χρήσης που θα μεταφερθούν.
              - paragraph [ref=e130]: Στη μεταφορά μπορεί να επιλεχθεί συγκεκριμένη οντότητα π.χ. Είδη αποθήκης ή η ένδειξη όλα .Για την ενότητα που θέλουμε να μεταφέρουμε θα πρέπει να ενεργοποιήσουμε το αντίστοιχο πεδίο “Μεταφορά’’. Στο πεδίο “Τύπος Παραστατικού” για τα είδη της αποθήκης μπορείτε να επιλέξετε αν θα μεταφερθούν μόνο οι ποσότητες, μόνο οι αξίες ή και τα δύο με το παραστατικό που θα δημιουργηθεί. Σε περίπτωση που η μεταφορά αφορά και αξίες (Μόνο Αξίες ή Ποσότητες & Αξίες). Στο πεδίο “Αποθήκες”, μπορείτε να επιλέξετε τις αποθήκες για τις οποίες θα εκτελεστεί η ενέργεια της συγκέντρωσης και μεταφοράς υπολοίπων. Στο πεδίο “Σειρά Παραστατικού”, ορίζετε την σειρά για το παραστατικό που θα προκύψει από την συγκεκριμένη ενέργεια. Για τους συν/μένους θα πρέπει να επιλεχθεί τύπος Παραστατικού “Χρέωσης ” και “Πίστωσης ” καθώς και την αντίστοιχη σειρά.
