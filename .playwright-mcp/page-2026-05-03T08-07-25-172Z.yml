  - generic [ref=e144]:
    - heading "SOFT1 Cloud ERP" [level=1] [ref=e145]
    - heading [level=4]
  - generic [ref=e148]:
    - heading "Το Cloud ERP στα μέτρα σας" [level=2] [ref=e149]
    - paragraph
    - img "img-erp-1" [ref=e150]
    - paragraph [ref=e151]:
      - text: Το SOFT1 Cloud ERP Series 6 αποτελεί μία σύγχρονη λύση μηχανογράφησης που απλοποιεί όλες τις διαδικασίες της επιχείρησής σας, αποβάλλοντας την πολυπλοκότητα από την καθημερινή της λειτουργία. Ενσωματώνοντας πλούσια λειτουργικότητα, προσαρμόζεται απολύτως στις ιδιαίτερες απαιτήσεις σας, με την ελάχιστη επένδυση σε κόστος και πόρους IT. Με ενότητες που υποστηρίζουν το σύνολο των δραστηριοτήτων σας, από την παραγωγή και την αλυσίδα εφοδιασμού έως τις πωλήσεις, σας βοηθάει να διαχειριστείτε καλύτερα τα οικονομικά σας, μειώνοντας σημαντικά το κόστος λειτουργίας της επιχείρησής σας.
      - text: Λειτουργώντας στα υπερσύγχρονα data centers της πλατφόρμας Microsoft Windows Azure, το SOFT1 Cloud ERP Series 6 αξιοποιεί τις προηγμένες τεχνολογίες της Microsoft, προσφέροντας μέγιστη ασφάλεια και αξιοπιστία.
      - text: Με ευέλικτη σχεδίαση, το σύστημα ERP της ENTERSOFTONE επιτρέπει στους ανθρώπους σας να αξιοποιούν τη λειτουργικότητά του, από την πρώτη κιόλας ημέρα! Με φιλικό περιβάλλον εργασίας, που προσαρμόζεται εύκολα στο ρόλο κάθε εργαζόμενου, διευκολύνει σημαντικά την εκτέλεση κρίσιμων εργασιών. Πλήρως παραμετροποιήσιμο και εύκολα επεκτάσιμο, το SOFT1 ERP Series 6 καλύπτει τις πραγματικές ανάγκες της επιχείρησής σας, παρέχοντας σας τη δυνατότητα να ανταποκρίνεστε άμεσα στις προκλήσεις της αγοράς.
    - paragraph [ref=e152]
    - paragraph
  - generic [ref=e154]:
    - img [ref=e157]
    - generic [ref=e158]:
      - heading "Πρόσβαση από παντού, με οποιαδήποτε συσκευή" [level=2] [ref=e159]
      - paragraph
      - paragraph [ref=e160]: Το SOFT1 Cloud ERP Series 6 αποτελεί ένα σύστημα ERP νέας γενιάς που έχει αναπτυχθεί με επίκεντρο τους ανθρώπους της επιχείρησής σας. Με ενσωματωμένες web και mobile εφαρμογές, προσφέρει στα στελέχη σας τη δυνατότητα να εργαστούν με ασφάλεια από οπουδήποτε, ανταποκρινόμενα καλύτερα στις ανάγκες των πελατών σας.
      - paragraph
