  - heading "Τα οφέλη του SOFT1 Cloud ERP" [level=2] [ref=e163]
  - generic [ref=e164]:
    - generic [ref=e165]:
      - img [ref=e166]
      - heading "Χαμηλό TCO" [level=3] [ref=e167]
      - paragraph
      - paragraph [ref=e168]: Κρατήστε χαμηλά το κόστος σας, απελευθερώνοντας τους ανθρώπους του ΙΤ. Ξεχάστε τις υψηλές επενδύσεις σε hardware και software. Επιλέξτε το SOFT1 Cloud ERP Series 6 με το συνδρομητικό μοντέλο pay-as-you-go, χωρίς συμβιβασμούς σε απόδοση και λειτουργία.
      - paragraph
    - generic [ref=e169]:
      - img [ref=e170]
      - heading "Καινοτομία mobility" [level=3] [ref=e171]
      - paragraph
      - paragraph [ref=e172]: Αυξήστε την παραγωγικότητα των ανθρώπων σας, παρέχοντάς τους όλες τις πληροφορίες που χρειάζονται, ακόμη και όταν βρίσκονται εκτός γραφείου. Το SOFT1 Cloud ERP Series 6 προσφέρει μία πρωτοποριακή εμπειρία χρήσης, χωρίς την ανάγκη πρόσθετης εκπαίδευσης.
      - paragraph
    - generic [ref=e173]:
      - img [ref=e174]
      - heading "Μέγιστη ασφάλεια" [level=3] [ref=e175]
      - paragraph
      - paragraph [ref=e176]: Λειτουργώντας στα data centers της πλατφόρμας Microsoft Windows Azure, το SOFT1 Cloud ERP Series 6 σας απαλλάσσει από κάθε άγχος και ευθύνη, προσφέροντας μέγιστα επίπεδα ασφάλειας, συνεχή έλεγχο, αυτόματη λήψη backup και προηγμένες λύσεις ανάκτησης δεδομένων.
      - paragraph
    - generic [ref=e177]:
      - img [ref=e178]
      - heading "Υψηλή προστιθέμενη αξία" [level=3] [ref=e179]
      - paragraph
      - paragraph [ref=e180]: Χωρίς ανάγκες για πρόσθετο hardware, το SOFT1 Cloud ERP Series 6 είναι έτοιμο προς χρήση σε λίγες μόνο εβδομάδες αντί για μήνες, επιτρέποντάς σας να ασχοληθείτε μόνο με το πώς θα τρέξετε πιο αποδοτικά την επιχείρησή σας.
      - paragraph
    - generic [ref=e181]:
      - img [ref=e182]
      - heading "Ευέλικτη διαμόρφωση" [level=3] [ref=e183]
      - paragraph
      - paragraph [ref=e184]: Κερδίστε περισσότερα με λιγότερα, προσαρμόζοντας εύκολα την εγκατάστασή σας, κάθε φορά που αυτό απαιτείται. Με το SOFT1 Cloud ERP Series 6, δεν χρειάζεται να προβληματίζεστε πλέον για τη διαχείριση των μηχανογραφικών σας πόρων.
      - paragraph
    - generic [ref=e185]:
      - img [ref=e186]
      - heading "Διαρκής αναβάθμιση" [level=3] [ref=e187]
